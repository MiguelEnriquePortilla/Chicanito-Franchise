<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guía del Inversionista · Chicken Chicanito</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <main class="entrada">
    <div class="entrada-tarjeta">
      <h1 class="entrada-titulo">Guía del Inversionista</h1>
      <p class="entrada-subtitulo">Chicken Chicanito · Modelo de franquicia CEDIS</p>
      <form class="entrada-form" id="form-entrada" novalidate>
        <label for="clave" class="sr-only">Tu clave de acceso</label>
        <input id="clave" name="clave" type="text" placeholder="Tu clave de acceso" autocomplete="off" autocapitalize="characters" required>
        <p class="entrada-error" id="entrada-error" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-ancho" id="btn-entrar">Entrar</button>
      </form>
      <p class="entrada-pie">¿No tienes clave? Escríbenos al <a href="tel:8672823207">867 282 3207</a>.</p>
    </div>
  </main>
  <script src="/js/entrada.js"></script>
</body>
</html>
